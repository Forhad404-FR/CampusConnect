# Render Blueprint: deploys the whole app (React frontend + Node API) as ONE free web service.
# The database is a free PostgreSQL from Neon (https://neon.tech); paste its connection string
# into DATABASE_URL when Render asks for it. See README.md, section "Deploy".
services:
  - type: web
    name: campusconnect
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
